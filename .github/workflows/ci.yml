name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q app

      - name: Deterministic contracts
        run: python -m pytest tests/test_contracts.py -q

      - name: Golden set scaffold
        run: python -m app.evals.runner

      - name: Docker build
        run: docker build -t arslan-agent-service:ci .
